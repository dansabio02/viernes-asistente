name: Build APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"



      - name: Instalar plataforma y herramientas de Android
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin | head -1)/sdkmanager
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null
          "$SDKM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de depuración
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: viernes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
