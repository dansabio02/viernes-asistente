<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00D4FF">
<title>VIERNES · Asistente Personal</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }

  :root {
    --cyan: #00D4FF;
    --cyan-soft: rgba(0,212,255,.35);
    --cyan-faint: rgba(0,212,255,.08);
    --bg: #04070F;
  }

  body {
    font-family: 'Rajdhani', sans-serif;
    color: #CFE9F5;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(0,212,255,.12), transparent 55%),
      linear-gradient(rgba(0,212,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,.035) 1px, transparent 1px);
    background-size: 100% 100%, 44px 44px, 44px 44px;
    overscroll-behavior-y: contain;
  }

  .font-hud { font-family: 'Orbitron', sans-serif; }
  .font-mono2 { font-family: 'Share Tech Mono', monospace; }

  /* ═══ MARCO HUD ═══ */
  .hud-esquina { position: fixed; width: 26px; height: 26px; z-index: 50; pointer-events: none; opacity: .55; }
  .hud-tl { top: 8px; left: 8px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .hud-tr { top: 8px; right: 8px; border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
  .hud-bl { bottom: 8px; left: 8px; border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .hud-br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
  .scanlines {
    position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(0deg, rgba(0,212,255,.025) 0 1px, transparent 1px 3px);
  }

  .custom-scrollbar::-webkit-scrollbar { width: 5px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,212,255,.3); border-radius: 2px; }

  /* ═══ REACTOR DE ARCO (orbe) — HIPER REALISTA ═══ */
  .orb-wrap { animation: flotar 7s ease-in-out infinite; }
  @keyframes flotar { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-12px) scale(1.02); } }

  .orb {
    --glow: rgba(100,116,139,.35);
    width: 360px; height: 360px; position: relative; cursor: pointer; user-select: none;
    transition: all .5s cubic-bezier(.4,0,.2,1);
    filter: drop-shadow(0 0 8px rgba(0,0,0,.6));
  }
  .orb.detenido   { --glow: rgba(90,100,110,.4);   filter: drop-shadow(0 0 10px rgba(0,0,0,.5)); }
  .orb.escuchando { --glow: rgba(0,212,255,.95);   filter: drop-shadow(0 0 30px rgba(0,212,255,.6)); }
  .orb.activado   { --glow: rgba(200,246,255,1);    filter: drop-shadow(0 0 50px rgba(0,212,255,.9)); }
  .orb.hablando   { --glow: rgba(52,255,178,.95);   filter: drop-shadow(0 0 40px rgba(52,255,178,.7)); }

  /* Capa de neón exterior (bloom) */
  .orb-neon {
    position: absolute; inset: -24px; border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
    opacity: 0; transition: opacity .5s;
    animation: pulso 4s ease-in-out infinite;
    pointer-events: none;
    z-index: -1;
  }
  .orb:not(.detenido) .orb-neon { opacity: .7; }
  @keyframes pulso { 0%,100% { transform: scale(1); opacity: .6; } 50% { transform: scale(1.15); opacity: .3; } }

  .ripple { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--glow); opacity: 0; animation: ripple 3.4s ease-out infinite; pointer-events: none; }
  .ripple.r2 { animation-delay: 1.7s; }
  .orb.detenido .ripple { animation-play-state: paused; }
  @keyframes ripple { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(2.2); opacity: 0; } }

  /* Partículas flotantes (polvo estelar) */
  .particula {
    position: absolute; border-radius: 50%; background: var(--glow);
    pointer-events: none; z-index: 0; opacity: 0;
  }

  .ticks {
    position: absolute; inset: -22px; border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, var(--glow) 0deg 1deg, transparent 1deg 7deg);
    -webkit-mask: radial-gradient(circle, transparent 58%, black 59%, black 64%, transparent 65%);
            mask: radial-gradient(circle, transparent 58%, black 59%, black 64%, transparent 65%);
    animation: girar 50s linear infinite;
  }

  .anillo { position: absolute; border-radius: 50%; pointer-events: none; }
  .a1 { inset: 0; border: 2px dashed var(--glow); animation: girar 20s linear infinite; opacity: .6; }
  .a2 { inset: 34px; border: 2px dotted var(--glow); animation: girar 14s linear infinite reverse; opacity: .5; }
  .a3 { inset: 68px; border: 3px double var(--glow); animation: girar 30s linear infinite; opacity: .4; }
  .a4 { inset: 102px; border: 1px solid rgba(255,255,255,.15); animation: girar 16s linear infinite; opacity: .3; }

  .barrido {
    position: absolute; inset: 94px; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 0deg, transparent 0deg, var(--glow) 40deg, transparent 80deg);
    -webkit-mask: radial-gradient(circle, transparent 48%, black 49%);
            mask: radial-gradient(circle, transparent 48%, black 49%);
    animation: girar 5s linear infinite;
  }
  .orb.activado .barrido { animation-duration: 1.4s; }
  .orb.activado .a1 { animation-duration: 3.5s; }
  .orb.activado .a2 { animation-duration: 2.8s; }

  /* Núcleo con efecto vidrio/cristal */
  .nucleo {
    position: absolute; inset: 116px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 40% 35%,
      rgba(255,255,255,.15) 0%,
      var(--glow-suave) 35%,
      rgba(0,0,0,.4) 75%);
    border: 1px solid rgba(255,255,255,.2);
    box-shadow:
      inset 0 0 40px var(--glow-suave),
      0 0 50px var(--glow-suave),
      inset 0 2px 0 rgba(255,255,255,.4);
    transition: all .4s;
    overflow: hidden;
    backdrop-filter: blur(8px);
  }
  .brillo {
    position: absolute; inset: -50%;
    background: conic-gradient(from 0deg,
      transparent 0deg,
      rgba(255,255,255,.5) 25deg,
      transparent 60deg,
      rgba(255,255,255,.3) 120deg,
      transparent 180deg);
    animation: girar 8s linear infinite;
    pointer-events: none;
  }
  .orb-label {
    position: relative; z-index: 2;
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: .15em;
    color: #ffffff;
    text-shadow: 0 0 14px var(--glow), 0 0 30px var(--glow-suave), 0 0 50px var(--glow);
    transition: all .4s;
    white-space: nowrap;
    user-select: none;
    filter: drop-shadow(0 0 6px rgba(0,0,0,.8));
  }
  .orb.activado .orb-label { color: #ffffff; text-shadow: 0 0 18px #fff, 0 0 40px var(--glow); }
  .orb.hablando .orb-label { color: #ffffff; text-shadow: 0 0 18px #5cffb2, 0 0 40px rgba(52,255,178,.8); }

  .orb.hablando .nucleo { animation: latidoNucleo 1.1s infinite; }
  @keyframes latidoNucleo {
    0%,100% { transform: scale(1); box-shadow: inset 0 0 30px var(--glow-suave), 0 0 36px var(--glow-suave); }
    50% { transform: scale(1.03); box-shadow: inset 0 0 50px var(--glow-suave), 0 0 60px var(--glow-suave); }
  }

  @keyframes girar { to { transform: rotate(360deg); } }

  /* ═══ PANEL HUD ═══ */
  .panel {
    background: rgba(6,14,26,.75);
    border: 1px solid rgba(0,212,255,.22);
    box-shadow: 0 0 24px rgba(0,212,255,.06), inset 0 0 40px rgba(0,212,255,.03);
    backdrop-filter: blur(6px);
    position: relative;
  }
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none;
  }
  .panel::before { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

  .label-hud {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: .25em; text-transform: uppercase;
    color: rgba(0,212,255,.75);
  }

  .msg-user {
    background: linear-gradient(135deg, rgba(0,212,255,.16), rgba(0,212,255,.06));
    border: 1px solid rgba(0,212,255,.4);
    color: #E6F7FF;
  }
  .msg-ia {
    background: rgba(8,18,32,.85);
    border: 1px solid rgba(0,212,255,.25);
  }

  .chip {
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    padding: 6px 12px; border-radius: 2px;
    border: 1px solid rgba(0,212,255,.35); color: #9BDFFF;
    background: rgba(0,212,255,.05); transition: all .15s;
  }
  .chip:hover { background: rgba(0,212,255,.15); color: #fff; box-shadow: 0 0 12px rgba(0,212,255,.3); }
  .chip:active { transform: scale(.95); }

  .btn-hud {
    font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: .15em;
    padding: 8px 10px; border-radius: 2px;
    border: 1px solid rgba(0,212,255,.4); color: #BDEFFF;
    background: rgba(0,212,255,.07); transition: all .15s;
  }
  .btn-hud:hover { background: rgba(0,212,255,.18); color: #fff; box-shadow: 0 0 14px rgba(0,212,255,.35); }
  .btn-hud:active { transform: scale(.95); }

  input, select {
    background: rgba(4,10,20,.8) !important;
    border: 1px solid rgba(0,212,255,.3) !important;
    color: #DFF4FF !important;
    font-family: 'Rajdhani', sans-serif !important;
  }
  input:focus, select:focus {
    outline: none; border-color: var(--cyan) !important;
    box-shadow: 0 0 14px rgba(0,212,255,.35) !important;
  }
  input[type=range] { accent-color: var(--cyan); }

  .cursor-parpadea::after { content: "▌"; animation: parpadeo 1s steps(1) infinite; color: var(--cyan); }
  @keyframes parpadeo { 50% { opacity: 0; } }

  @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .mensaje { animation: aparecer .3s ease-out; }

  .typing-dots span { display: inline-block; width: 5px; height: 5px; margin: 0 2px; background: var(--cyan); border-radius: 50%; animation: rebote 1.2s infinite ease-in-out; }
  .typing-dots span:nth-child(1){ animation-delay: -.32s; } .typing-dots span:nth-child(2){ animation-delay: -.16s; }
  @keyframes rebote { 0%,80%,100%{ transform: scale(0); } 40%{ transform: scale(1); } }

  @keyframes latido { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.05);} }
  .latido { animation: latido 1.4s infinite; }

  /* ═══ BOTÓN FLOTANTE DE AJUSTES ═══ */
  .fab-settings {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(0,212,255,.12);
    border: 1px solid rgba(0,212,255,.5);
    color: #00D4FF;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 100;
    box-shadow: 0 0 20px rgba(0,212,255,.3);
    transition: all .2s;
  }
  .fab-settings:hover {
    background: rgba(0,212,255,.25);
    box-shadow: 0 0 30px rgba(0,212,255,.6);
    transform: scale(1.05);
  }
  .fab-settings:active { transform: scale(0.92); }

  .settings-panel {
    position: fixed;
    bottom: 90px;
    right: 24px;
    width: 320px;
    background: rgba(6,14,26,.92);
    border: 1px solid rgba(0,212,255,.22);
    border-radius: 8px;
    padding: 16px;
    z-index: 100;
    box-shadow: 0 0 40px rgba(0,212,255,.15);
    backdrop-filter: blur(8px);
  }
  .settings-panel.hidden { display: none; }

  @media (max-width: 640px) {
    .orb { width: 240px; height: 240px; }
    .nucleo { inset: 71px; } .a2 { inset: 21px; } .a3 { inset: 41px; }
    .barrido { inset: 59px; } .ticks { inset: -14px; }
    .orb-label { font-size: 12px; letter-spacing: .11em; }
  }

  /* ═══ CONTEXTO VISUAL — TARJETAS CON IMÁGENES E ICONOS ═══ */
  .contexto-visual {
    position: fixed;
    top: 130px;
    left: 50%;
    transform: translateX(-50%);
    width: 92%;
    max-width: 720px;
    z-index: 95;
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s ease, transform .5s ease;
  }
  .contexto-visual.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .contexto-visual.oculto { opacity: 0; transform: translateX(-50%) translateY(-20px); }

  .tarjeta-visual {
    background: rgba(6,14,26,.96);
    border: 1px solid rgba(0,212,255,.4);
    border-radius: 20px;
    padding: 24px 28px;
    box-shadow: 0 0 60px rgba(0,212,255,.2), inset 0 0 80px rgba(0,212,255,.08);
    backdrop-filter: blur(12px);
    display: flex;
    gap: 24px;
    align-items: center;
    animation: aparecerVisual .6s cubic-bezier(.34,1.56,.64,1);
    position: relative;
    overflow: hidden;
  }
  .tarjeta-visual::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--color-acento, #00D4FF), transparent);
    border-radius: 20px 20px 0 0;
  }
  .icono-visual {
    width: 96px; height: 96px; border-radius: 50%;
    background: rgba(0,212,255,.18);
    border: 2px solid rgba(0,212,255,.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; color: var(--color-icono, #00D4FF);
    flex-shrink: 0;
    box-shadow: 0 0 30px var(--color-sombra, rgba(0,212,255,.4));
    animation: flotarIcono 3s ease-in-out infinite;
    position: relative;
    z-index: 2;
  }
  .icono-visual::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.3);
    animation: girarLuz 4s linear infinite;
    opacity: .6;
  }
  @keyframes flotarIcono { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes girarLuz { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .contenido-visual { flex: 1; position: relative; z-index: 2; }
  .etiqueta-visual {
    font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .25em;
    text-transform: uppercase; color: var(--color-acento, #00D4FF); margin-bottom: 8px;
    display: block; font-weight: 700;
  }
  .titulo-visual {
    font-family: 'Orbitron', sans-serif; font-size: 1.7rem; font-weight: 900;
    color: #ffffff; margin: 0 0 10px 0; line-height: 1.15;
    text-shadow: 0 0 14px var(--color-acento, rgba(0,212,255,.5));
  }
  .texto-visual {
    font-family: 'Rajdhani', sans-serif; font-size: 1.15rem; color: #CFE9F5;
    margin: 0; line-height: 1.6;
  }
  .texto-visual.destacado { font-size: 1.5rem; font-weight: 800; color: #ffffff; }

  /* Imagen contextual dentro de la tarjeta */
  .imagen-visual {
    width: 120px; height: 120px; border-radius: 16px;
    object-fit: cover; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,.2);
    box-shadow: 0 0 20px rgba(0,0,0,.5);
    animation: pulseImg 2.5s ease-in-out infinite;
    position: relative; z-index: 2;
  }
  @keyframes pulseImg { 0%,100% { transform: scale(1); box-shadow: 0 0 0 rgba(0,212,255,.4); } 50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(0,212,255,.6); } }

  .clima-grande { font-size: 3rem; font-weight: 900; }
  .clima-detalle { font-size: 1.1rem; color: #9BDFFF; margin-top: 6px; }

  @keyframes aparecerVisual { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }

  .contextual-chip {
    display: inline-block; padding: 5px 14px; border-radius: 24px;
    font-family: 'Share Tech Mono', monospace; font-size: 10px;
    background: rgba(0,212,255,.15); border: 1px solid rgba(0,212,255,.35);
    color: var(--color-acento, #00D4FF); margin-bottom: 10px;
    font-weight: 700;
  }

  /* Fondo dinámico según contexto */
  .fondo-dinamico {
    position: fixed; inset: 0; z-index: -1;
    opacity: 0; transition: opacity .6s ease;
    background-size: cover; background-position: center;
  }
  .fondo-dinamico.activo { opacity: .18; }
</style>
<script src="config.js"></script>
  <script src="config.local.js"></script>
</head>
<body class="min-h-screen flex flex-col">

<!-- MARCO HUD -->
<div class="hud-esquina hud-tl"></div><div class="hud-esquina hud-tr"></div>
<div class="hud-esquina hud-bl"></div><div class="hud-esquina hud-br"></div>
<div class="scanlines"></div>

<!-- ═══ HEADER ═══ -->
<header class="sticky top-0 z-40 border-b" style="background: rgba(4,7,15,.9); border-color: rgba(0,212,255,.25); backdrop-filter: blur(8px);">
  <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="icon.svg" alt="VIERNES" class="w-9 h-9" style="filter: drop-shadow(0 0 8px rgba(0,212,255,.6));">
      <div>
        <div class="font-hud font-bold tracking-[.3em] text-white text-sm" style="text-shadow: 0 0 12px rgba(0,212,255,.8);">VIERNES</div>
        <div class="label-hud">Asistente personal · contexto visual</div>
      </div>
    </div>
    <div id="statusPill" class="panel flex items-center gap-2 px-3 py-1.5 rounded-sm">
      <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
      <span id="statusLabel" class="font-mono2 text-[11px] tracking-widest text-cyan-200">SISTEMA DETENIDO</span>
    </div>
  </div>
</header>

<main class="flex-grow w-full max-w-3xl mx-auto px-4 flex flex-col items-center justify-center gap-6 py-6">

  <!-- ═══ REACTOR ═══ -->
  <div class="flex flex-col items-center gap-4 pt-4">
    <div class="orb-wrap">
      <div id="orb" class="orb detenido" onclick="toggleEscucha()" title="Activar / desactivar modo siempre escuchando">
        <div class="ripple"></div>
        <div class="ripple r2"></div>
        <div class="ticks"></div>
        <div class="anillo a1"></div>
        <div class="anillo a2"></div>
        <div class="anillo a3"></div>
        <div class="barrido"></div>
        <div class="nucleo">
          <div class="brillo"></div>
          <div id="orbTexto" class="orb-label">VIERNES</div>
        </div>
        <div id="particulas"></div>
      </div>
    </div>
    <div class="text-center">
      <div id="estadoTexto" class="font-hud text-sm tracking-widest text-cyan-100">TOCA EL REACTOR PARA ACTIVAR</div>
      <div id="estadoSub" class="label-hud mt-1">PALABRA MÁGICA: <b class="text-cyan-300">"VIERNES"</b></div>
    </div>
  </div>
</main>

<!-- ═══ FONDOS DINÁMICOS POR CONTEXTO ═══ -->
<div id="fondoClima" class="fondo-dinamico" style="background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80');"></div>
<div id="fondoEspacio" class="fondo-dinamico" style="background-image: url('https://images.unsplash.com/photo-1446776811953-b23d57bd22aa?auto=format&fit=crop&w=1200&q=80');"></div>
<div id="fondoTecnologia" class="fondo-dinamico" style="background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80');"></div>
<div id="fondoNaturaleza" class="fondo-dinamico" style="background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80');"></div>
<div id="fondoNeutro" class="fondo-dinamico" style="background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200&q=80');"></div>

<!-- ═══ CONTEXTO VISUAL (se muestra al recibir respuesta) ═══ -->
<div id="contextoVisual" class="contexto-visual oculto"></div>

<footer class="w-full max-w-3xl mx-auto px-4 pb-5 flex flex-col items-center gap-4">

  <!-- ═══ INPUT ═══ -->
  <form onsubmit="enviarForm(event)" class="w-full flex items-center gap-2 pb-2">
    <button type="button" onclick="hablarAhora()" id="btnPush" title="Hablar ahora (push-to-talk)"
      class="shrink-0 p-3.5 rounded-sm text-white transition-all active:scale-95"
      style="background: rgba(0,212,255,.12); border: 1px solid rgba(0,212,255,.5);">
      <i class="fa-solid fa-microphone text-cyan-300"></i>
    </button>
    <input id="chatInput" type="text" placeholder="O escribe tu duda aquí…" autocomplete="off"
      class="flex-grow min-w-0 px-4 py-3 rounded-sm text-sm transition-all">
    <button type="submit" title="Enviar"
      class="shrink-0 p-3.5 rounded-sm text-white transition-all active:scale-95"
      style="background: rgba(0,212,255,.12); border: 1px solid rgba(0,212,255,.5);">
      <i class="fa-solid fa-arrow-up text-cyan-300"></i>
    </button>
  </form>

  <!-- Icono flotante de ajustes -->
  <button id="btnAjustes" class="fab-settings" onclick="toggleAjustes()" title="Ajustes del sistema">
    <i class="fa-solid fa-gear text-cyan-300"></i>
  </button>

  <!-- Panel de ajustes (oculto por defecto) -->
  <div id="panelAjustes" class="settings-panel hidden">
    <div class="flex justify-between items-center mb-3">
      <div class="label-hud">AJUSTES DEL SISTEMA</div>
      <button onclick="toggleAjustes()" class="text-cyan-400 hover:text-white">&times;</button>
    </div>
    <div class="space-y-4 text-xs">
      <label class="flex items-center justify-between gap-3">
        <span class="label-hud">🔊 Respuestas en voz</span>
        <input type="checkbox" id="ajVoz" onchange="guardarAjustes()" checked class="w-4 h-4">
      </label>
      <label class="flex items-center justify-between gap-3">
        <span class="label-hud">🌐 Voz natural (Edge neural)</span>
        <input type="checkbox" id="ajVozNat" onchange="guardarAjustes()" checked class="w-4 h-4">
      </label>
      <label class="flex items-center justify-between gap-3">
        <span class="label-hud">🎙️ Voz del sistema<br><span class="text-slate-500">elegir una desactiva la natural</span></span>
        <select id="ajVozSel" onchange="elegirVozLocal()" class="px-2 py-1 rounded-sm text-xs w-52"></select>
      </label>
      <label class="flex items-center justify-between gap-3">
        <span class="label-hud">⏩ Velocidad</span>
        <input type="range" id="ajVel" min="0.7" max="1.6" step="0.1" value="1" onchange="guardarAjustes()" class="w-32">
      </label>
      <label class="flex items-center justify-between gap-3">
        <span class="label-hud">📈 Tono <span class="text-slate-500">(voz del sistema)</span></span>
        <input type="range" id="ajTono" min="0.6" max="1.8" step="0.05" value="1" onchange="guardarAjustes()" class="w-32">
      </label>
      <label class="flex items-center justify-between gap-3">
        <span class="label-hud">🌎 Idioma de escucha</span>
        <select id="ajLang" onchange="guardarAjustes(true)" class="px-2 py-1 rounded-sm text-xs">
          <option value="es-MX">Español (México)</option>
          <option value="es-ES">Español (España)</option>
          <option value="es-US">Español (EE.UU.)</option>
        </select>
      </label>
      <div class="flex gap-2 pt-2">
        <button onclick="diagnosticar()" class="btn-hud flex-1"><i class="fa-solid fa-stethoscope mr-1"></i>PROBAR CONEXIÓN</button>
        <button onclick="hablar('Hola, soy VIERNES. Tu asistente personal, a tus órdenes.')" class="btn-hud flex-1"><i class="fa-solid fa-volume-high mr-1"></i>PROBAR VOZ</button>
      </div>
      <div class="pt-2">
        <button onclick="limpiarHistorial()" class="btn-hud w-full"><i class="fa-solid fa-trash mr-1"></i>BORRAR HISTORIAL</button>
      </div>
      <div class="pt-2">
        <button onclick="forzarActualizacion()" class="btn-hud w-full" title="Descarta la caché y recarga"><i class="fa-solid fa-arrows-rotate mr-1"></i>FORZAR ACTUALIZACIÓN</button>
      </div>
    </div>
  </div>
</footer>

<script src="viernes.js?v=18"></script>
<script>
  // Generador de partículas flotantes alrededor del orbe
  (function(){
    const cont = document.getElementById('particulas');
    if(!cont) return;
    for(let i=0;i<28;i++){
      const p = document.createElement('div');
      p.className = 'particula';
      const t = Math.random()*6.28;
      const r = 100 + Math.random()*120;
      const x = Math.cos(t)*r;
      const y = Math.sin(t)*r;
      p.style.left = '50%'; p.style.top = '50%';
      p.style.width = (2 + Math.random()*4) + 'px';
      p.style.height = p.style.width;
      p.style.opacity = Math.random()*.6 + .2;
      p.style.transform = `translate(${x}px,${y}px)`;
      p.style.transition = 'transform 6s linear, opacity 2s ease-in-out';
      cont.appendChild(p);
      setTimeout(()=>{
        p.style.transform = `translate(${(x*1.5)}px,${(y*1.5)}px)`;
        p.style.opacity = '0';
      }, i*200);
      setInterval(()=>{
        const tt = Math.random()*6.28;
        const rr = 80 + Math.random()*140;
        p.style.transform = `translate(${Math.cos(tt)*rr}px,${Math.sin(tt)*rr}px)`;
        p.style.opacity = Math.random()*.5 + .1;
      }, 7000 + i*300);
    }
  })();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
